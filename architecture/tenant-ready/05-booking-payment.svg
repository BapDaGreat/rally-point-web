<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="05-booking-payment-title 05-booking-payment-desc">
<title id="05-booking-payment-title">Confirm only after payment</title>
<desc id="05-booking-payment-desc">Rally Point receives payment directly; a trusted webhook confirms the reservation. The payment account is keyed by club_id for future clubs; webhook retries cannot duplicate ledger writes.</desc>
