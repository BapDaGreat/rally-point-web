lex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Plan, status, expiry</text><rect x="732" y="440" width="276" height="132" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><text x="756" y="484" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" >Club staff role</text><text x="756" y="516" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >user_id + club_id</text><text x="756" y="541" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Admin or staff</text><rect x="448" y="604" width="560" height="136" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><text x="472" y="648" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" >Booking + participation</text><text x="472" y="680" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >player_id + club_id + venue_id + resource_id</text><text x="472" y="705" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Club membership applies at every club venue.</text><rect x="1080" y="296" width="424" height="112" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><text x="1104" y="340" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" >Venue</text><text x="1104" y="372" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >club_id; local schedule and rules</text><rect x="1080" y="440" width="424" height="132" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><text x="1104" y="484" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" >Bookable resource</text><text x="1104" y="516" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >venue_id; court, field, or room</text><text x="1104" y="541" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Atomic allocation prevents overlap.</text><rect x="1080" y="604" width="424" height="136" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><text x="1104" y="648" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" >Staff venue grant</text><text x="1104" y="680" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >staff role + venue_id</text><text x="1104" y="705" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Staff operate assigned venues only.</text>
