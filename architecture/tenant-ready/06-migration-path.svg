<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="06-migration-path-title 06-migration-path-desc">
<title id="06-migration-path-title">Make Rally Point tenant-ready</title>
<desc id="06-migration-path-desc">Backfill one active club, then verify isolation in local and staging. The dated authorization migration in this repo is labelled local/staging only.</desc>
<defs><marker id="06-migration-path-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#214B78"/></marker></defs>
