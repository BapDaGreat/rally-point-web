<path d="M 352 452 H 366" fill="none" stroke="#214B78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#06-migration-path-arrow)" /><rect x="72" y="270" width="280" height="364" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><rect x="96" y="294" width="58" height="28" rx="14" fill="#EAF0F7" stroke="none" stroke-width="0"/><text x="125" y="313" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" >01</text><text x="96" y="382" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" >Reconcile</text><text x="96" y="438" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Check target migration history</text><text x="96" y="472" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >and current live schema.</text><text x="96" y="506" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Map Rally Point records.</text><path d="M 646 452 H 660" fill="none" stroke="#214B78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#06-migration-path-arrow)" /><rect x="366" y="270" width="280" height="364" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><rect x="390" y="294" width="58" height="28" rx="14" fill="#EAF0F7" stroke="none" stroke-width="0"/><text x="419" y="313" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" >02</text><text x="390" y="382" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" >Backfill</text><text x="390" y="438" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Create Rally Point Club and</text><text x="390" y="472" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >its venues. Link current records</text><text x="390" y="506" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >without changing ownership.</text><path d="M 940 452 H 954" fill="none" stroke="#214B78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#06-migration-path-arrow)" /><rect x="660" y="270" width="280" height="364" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><rect x="684" y="294" width="58" height="28" rx="14" fill="#EAF0F7" stroke="none" stroke-width="0"/><text x="713" y="313" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" >03</text><text x="684" y="382" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" >Enforce</text><text x="684" y="438" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Add club and venue keys,</text><text x="684" y="472" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >matching foreign keys,</text><text x="684" y="506" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >RLS, grants, and indexes.</text><path d="M 1234 452 H 1248" fill="none" stroke="#214B78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#06-migration-path-arrow)" /><rect x="954" y="270" width="280" height="364" rx="10" fill="#FFFFFF" stroke="#C9D4E1" stroke-width="2"/><rect x="978" y="294" width="58" height="28" rx="14" fill="#EAF0F7" stroke="none" stroke-width="0"/><text x="1007" y="313" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" >04</text><text x="978" y="382" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" >Move flows</text><text x="978" y="438" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Use trusted reservations,</text><text x="978" y="472" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >club checkout, public board</text><text x="978" y="506" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >and scoped support reads.</text><rect x="1248" y="270" width="280" height="364" rx="10" fill="#FFFFFF" stroke="#8A1D1D" stroke-width="3"/><rect x="1272" y="294" width="58" height="28" rx="14" fill="#F8EEEE" stroke="none" stroke-width="0"/><text x="1301" y="313" fill="#8A1D1D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" >05</text><text x="1272" y="382" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" >Verify</text><text x="1272" y="438" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Use two clubs in staging to</text><text x="1272" y="472" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >test denied access, payments</text><text x="1272" y="506" fill="#526479" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >and concurrency before launch.</text><rect x="72" y="684" width="1456" height="104" rx="8" fill="#0A2749" stroke="#0A2749" stroke-width="0"/><text x="100" y="726" fill="#FFFFFF" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1.4">RELEASE GATE</text><text x="100" y="760" fill="#FFFFFF" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" >Keep one active club until cross-club isolation, booking overlap, and payments pass in staging.</text>
