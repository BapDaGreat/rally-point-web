<rect x="0" y="0" width="1600" height="12" rx="0" fill="#0A2749" stroke="#0A2749" stroke-width="0"/>
<text x="72" y="68" fill="#8A1D1D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="1.8">RALLY POINT  /  TENANT-READY ARCHITECTURE  /  06</text>
<text x="72" y="132" fill="#0A2749" font-family="IBM Plex Sans, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start" >Make Rally Point tenant-ready</text>
