<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="Rally Point">
  <defs>
    <linearGradient id="paddleFace" x1="40" y1="10" x2="160" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="rallyRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="pointMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Paddle handle -->
  <path d="M148 118 C146 140 144 158 142 178 C141 186 148 190 156 186 C164 182 168 172 166 160 C162 140 158 128 156 118 Z" fill="#1e3a8a"/>
  <path d="M150 122 C149 142 147 160 146 176 C146 180 150 182 154 180 C158 178 160 172 159 162 C156 142 154 130 152 122 Z" fill="#2563eb" opacity="0.55"/>

  <!-- Paddle face -->
  <ellipse cx="150" cy="72" rx="78" ry="62" fill="url(#paddleFace)" filter="url(#soft)"/>
  <ellipse cx="150" cy="72" rx="68" ry="52" fill="none" stroke="#0f172a" stroke-opacity="0.15" stroke-width="3"/>
  <!-- face highlight -->
  <ellipse cx="128" cy="52" rx="28" ry="16" fill="#fff" opacity="0.18" transform="rotate(-18 128 52)"/>

  <!-- Wordmark -->
  <g filter="url(#soft)" transform="translate(8 8) rotate(-8 160 100)">
    <text x="52" y="78" font-family="Arial Black, Impact, Haettenschweiler, sans-serif" font-size="48" font-weight="900" letter-spacing="-1.5" fill="url(#rallyRed)">RALLY</text>
    <text x="48" y="122" font-family="Arial Black, Impact, Haettenschweiler, sans-serif" font-size="48" font-weight="900" letter-spacing="-1.5" fill="url(#pointMetal)">POINT</text>
    <!-- Banner -->
    <path d="M70 130 L250 130 L242 152 L62 152 Z" fill="#e11d48"/>
    <path d="M70 130 L250 130 L246 140 L66 140 Z" fill="#fb7185" opacity="0.35"/>
    <text x="160" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#fff">PICKLEBALL</text>
  </g>
</svg>
